<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eisenwerk Idle</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @keyframes ring { 0% { transform: scale(.85); opacity: .9 } 100% { transform: scale(1.7); opacity: 0 } }
  .ring { animation: ring var(--dur, 2s) ease-out infinite }
  @keyframes rise { to { transform: translate(var(--dx), -70px); opacity: 0 } }
  .particle { position: absolute; pointer-events: none; white-space: nowrap; font: 600 11px ui-monospace, monospace; animation: rise 1.2s ease-out forwards }
  @keyframes pop { 50% { transform: scale(.94) } }
  .pop { animation: pop .12s }
</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<div class="flex flex-col lg:flex-row min-h-screen">

  <!-- Sidebar: Live-Produktion -->
  <aside class="lg:w-80 lg:sticky lg:top-0 lg:h-screen bg-slate-900 border-b lg:border-b-0 lg:border-r border-slate-800 p-4 flex flex-col gap-4 overflow-y-auto">
    <h1 class="text-xl font-bold tracking-tight">⚙️ Eisenwerk Idle</h1>
    <div id="meters" class="space-y-3"></div>
    <button id="collect" class="relative w-full py-4 rounded-xl bg-orange-600 hover:bg-orange-500 font-bold text-lg shadow-lg shadow-orange-900/40 select-none">
      ⛏️ Erz sammeln
      <div id="clickVal" class="text-xs font-normal opacity-80"></div>
    </button>
    <div id="conv" class="text-xs text-slate-400"></div>
    <div class="mt-auto flex justify-between text-xs text-slate-500">
      <span id="saved">–</span>
      <button id="reset" class="hover:text-red-400">Spielstand löschen</button>
    </div>
  </aside>

  <!-- Hauptbereich -->
  <main class="flex-1 p-4 lg:p-6">
    <nav class="flex gap-2 mb-5">
      <button data-tab="gens" class="tab px-4 py-2 rounded-lg font-semibold">🏭 Generatoren</button>
      <button data-tab="upgrades" class="tab px-4 py-2 rounded-lg font-semibold">⬆️ Upgrades</button>
      <button data-tab="research" class="tab px-4 py-2 rounded-lg font-semibold">🔬 Forschung</button>
    </nav>
    <section id="tab-gens" class="panel">
      <p class="text-sm text-slate-400 mb-3">Alle 10 Stufen verdoppelt sich die Produktion eines Generators. Ab Stufe 10 (Elite) kostet jede Stufe zusätzlich Titan.</p>
      <div id="list-gens" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-3"></div>
    </section>
    <section id="tab-upgrades" class="panel">
      <h2 class="font-semibold mb-2">Klick-Effizienz</h2>
      <div id="list-upgrades" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-3 mb-6"></div>
      <h2 class="font-semibold mb-2">Elite-Boosts <span class="text-xs text-fuchsia-400">(benötigen Titan)</span></h2>
      <div id="list-boosts" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-3"></div>
    </section>
    <section id="tab-research" class="panel">
      <div id="list-research" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-3"></div>
    </section>
  </main>
</div>
<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-800 border border-slate-600 px-4 py-2 rounded-lg text-sm opacity-0 transition-opacity pointer-events-none"></div>

<script>
// ---------- Daten ----------
const RES = {
  ore:   { name: 'Eisenerz',        icon: '🪨', color: '#f97316' },
  steel: { name: 'Stahlbarren',     icon: '🔩', color: '#38bdf8' },
  titan: { name: 'Titan-Legierung', icon: '💎', color: '#d946ef' },
};

const GENS = [
  { id: 'mine',    icon: '⛏️', name: 'Eisenmine',      res: 'ore',   base: 1,    cost: { ore: 15 },                g: 1.15 },
  { id: 'drill',   icon: '🏗️', name: 'Bohrturm',       res: 'ore',   base: 12,   cost: { ore: 400, steel: 10 },    g: 1.17 },
  { id: 'smelter', icon: '🔥', name: 'Schmelzofen',    res: 'steel', base: 0.25, cost: { ore: 150 },               g: 1.2 },
  { id: 'forge',   icon: '⚗️', name: 'Titan-Schmiede', res: 'titan', base: 0.02, cost: { ore: 20000, steel: 500 }, g: 1.25, req: 'titanium' },
];

const RESEARCH = [
  { id: 'geology',    name: 'Geologie',                   desc: '+25% Erzproduktion.',                                         cost: { ore: 300 },                         mult: { ore: 1.25 } },
  { id: 'resonance',  name: 'Resonanzhammer',             desc: 'Jeder Klick gibt zusätzlich 5% deiner Erz/s.',                cost: { ore: 1500, steel: 15 },             req: ['geology'] },
  { id: 'converter',  name: 'Auto-Konverter',             desc: 'Wandelt automatisch 20% der Erzproduktion in Stahl um (25:1).', cost: { ore: 3000, steel: 40 },           req: ['geology'] },
  { id: 'metallurgy', name: 'Metallurgie',                desc: '+50% Stahlproduktion.',                                       cost: { ore: 8000, steel: 120 },            req: ['converter'], mult: { steel: 1.5 } },
  { id: 'titanium',   name: 'Titan-Extraktion',           desc: 'Schaltet die Titan-Schmiede frei.',                           cost: { ore: 15000, steel: 250 },           req: ['metallurgy'] },
  { id: 'efficiency', name: 'Globale Effizienz',          desc: '+50% Produktion aller Materialien.',                          cost: { steel: 800, titan: 10 },            req: ['titanium'], mult: { all: 1.5 } },
  { id: 'autoclick',  name: 'Automatisierte Spitzhacken', desc: '5 automatische Klicks pro Sekunde.',                          cost: { steel: 2000, titan: 30 },           req: ['resonance', 'efficiency'] },
  { id: 'quantum',    name: 'Quantenmetallurgie',         desc: '+100% Produktion aller Materialien.',                         cost: { ore: 1e6, steel: 1e4, titan: 250 }, req: ['autoclick'], mult: { all: 2 } },
];
const RMAP = Object.fromEntries(RESEARCH.map(r => [r.id, r]));

const BOOSTS = [
  { id: 'diamond',   name: 'Diamantbohrer',  desc: 'Erzproduktion ×2.',      cost: { steel: 150, titan: 5 },    mult: { ore: 2 } },
  { id: 'turbo',     name: 'Hochofen-Turbo', desc: 'Stahlproduktion ×2.',    cost: { steel: 500, titan: 20 },   mult: { steel: 2 } },
  { id: 'press',     name: 'Quantenpresse',  desc: 'Titanproduktion ×2.',    cost: { steel: 2000, titan: 60 },  mult: { titan: 2 } },
  { id: 'overclock', name: 'Overclocking',   desc: 'Alle Materialien ×1.5.', cost: { ore: 5e5, titan: 150 },    mult: { all: 1.5 } },
];

const DEF = () => ({ ore: 0, steel: 0, titan: 0, click: 0, research: {}, boosts: {},
  gens: Object.fromEntries(GENS.map(g => [g.id, 0])) });
let S = DEF();

// ---------- Formeln ----------
const $ = s => document.querySelector(s);
const fmt = n => {
  if (n < 1000) return n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2);
  const u = ['K', 'M', 'B', 'T', 'Qa', 'Qi'], i = Math.floor(Math.log10(n) / 3);
  return i > u.length ? n.toExponential(2) : (n / 1000 ** i).toFixed(2) + u[i - 1];
};
const afford = c => !c || Object.entries(c).every(([k, v]) => S[k] >= v);
const pay = c => { for (const k in c) S[k] -= c[k]; };
const owned = () => [...RESEARCH.filter(x => S.research[x.id]), ...BOOSTS.filter(x => S.boosts[x.id])];
const mult = res => owned().reduce((m, x) => m * (x.mult?.[res] ?? 1) * (x.mult?.all ?? 1), 1);
const milestone = n => 2 ** Math.floor(n / 10);
const genOut = (g, n = S.gens[g.id]) => g.base * n * milestone(n) * mult(g.res);
const clickBase = (n = S.click) => (1 + 2 * n) * milestone(n) * mult('ore');
const eliteCost = (n, base) => n >= 10 ? Math.ceil(base * 1.3 ** (n - 10)) : 0;

function genCost(g) {
  const n = S.gens[g.id], c = {};
  for (const k in g.cost) c[k] = Math.ceil(g.cost[k] * g.g ** n);
  if (n >= 10) c.titan = (c.titan || 0) + eliteCost(n, 2);
  return c;
}
function clickCost() {
  const n = S.click, c = { ore: Math.ceil(25 * 1.5 ** n) };
  if (n >= 2) c.steel = Math.ceil(2 * 1.45 ** (n - 2));
  if (n >= 10) c.titan = eliteCost(n, 3);
  return c;
}
function rates() {
  const r = { ore: 0, steel: 0, titan: 0 };
  for (const g of GENS) r[g.res] += genOut(g);
  const click = clickBase() + (S.research.resonance ? 0.05 * r.ore : 0);
  if (S.research.autoclick) r.ore += 5 * click;
  r.conv = 0;
  if (S.research.converter) { r.conv = r.ore * 0.2; r.ore -= r.conv; r.steel += r.conv / 25; }
  r.click = click;
  return r;
}

// ---------- Kaufbare Einträge ----------
const ITEMS = [
  ...GENS.map(g => ({ list: 'gens', id: 'g_' + g.id,
    info() {
      const n = S.gens[g.id], locked = g.req && !S.research[g.req];
      return { title: `${g.icon} ${g.name}`, badge: `Stufe ${n}${n >= 10 ? ' ⭐' : ''}`,
        desc: `${fmt(genOut(g))} ${RES[g.res].icon}/s · nächste Stufe <b class="text-emerald-400">+${fmt(genOut(g, n + 1) - genOut(g))}/s</b>`,
        note: locked ? `🔒 Benötigt Forschung: ${RMAP[g.req].name}` : n >= 9 ? '⭐ Elite-Stufe: kostet Titan' : `×2 bei Stufe ${Math.ceil((n + 1) / 10) * 10}`,
        cost: genCost(g), state: locked ? 'locked' : 'ok' };
    },
    buy() { S.gens[g.id]++; } })),
  { list: 'upgrades', id: 'click',
    info() {
      const n = S.click;
      return { title: '⛏️ Verstärkte Spitzhacke', badge: `Stufe ${n}`,
        desc: `Basis-Klick: ${fmt(clickBase())} → <b class="text-emerald-400">${fmt(clickBase(n + 1))}</b> Erz`,
        note: n >= 9 ? '⭐ Elite-Stufe: kostet Titan' : n >= 1 ? 'Ab Stufe 2 kostet es Stahl' : '',
        cost: clickCost(), state: 'ok' };
    },
    buy() { S.click++; } },
  ...BOOSTS.map(b => ({ list: 'boosts', id: 'b_' + b.id,
    info() {
      const done = S.boosts[b.id];
      return { title: `🚀 ${b.name}`, badge: done ? '✓ Aktiv' : '', desc: b.desc, note: '',
        cost: done ? null : b.cost, state: done ? 'done' : 'ok' };
    },
    buy() { S.boosts[b.id] = 1; } })),
  ...RESEARCH.map(r => ({ list: 'research', id: 'r_' + r.id,
    info() {
      const done = S.research[r.id], miss = (r.req || []).filter(q => !S.research[q]);
      return { title: `🔬 ${r.name}`, badge: done ? '✓ Erforscht' : '', desc: r.desc,
        note: !done && miss.length ? '🔒 Benötigt: ' + miss.map(q => RMAP[q].name).join(', ') : '',
        cost: done ? null : r.cost, state: done ? 'done' : miss.length ? 'locked' : 'ok' };
    },
    buy() { S.research[r.id] = 1; toast(`Forschung abgeschlossen: ${r.name}`); } })),
];
const IMAP = Object.fromEntries(ITEMS.map(i => [i.id, i]));

const costHtml = c => c ? Object.entries(c).filter(([, v]) => v > 0)
  .map(([k, v]) => `<span class="${S[k] >= v ? 'text-slate-200' : 'text-red-400'}">${RES[k].icon} ${fmt(v)}</span>`).join(' &nbsp;') : '';

function buildCards() {
  for (const it of ITEMS) {
    const el = document.createElement('button');
    el.dataset.id = it.id;
    el.className = 'text-left rounded-xl p-4 bg-slate-800 hover:bg-slate-700 border-2 border-slate-700 transition';
    el.innerHTML = `<div class="flex justify-between gap-2"><span class="t font-semibold"></span><span class="b text-xs text-slate-400"></span></div>
      <div class="d text-sm text-slate-300 mt-1"></div><div class="n text-xs text-amber-400 mt-1"></div><div class="c text-sm font-mono mt-2"></div>`;
    it.el = el;
    $('#list-' + it.list).append(el);
  }
}
const set = (el, v) => { if (el._v !== v) { el._v = v; el.innerHTML = v; } };

function updateCards() {
  for (const it of ITEMS) {
    const i = it.info(), el = it.el, can = i.state === 'ok' && afford(i.cost);
    set(el.querySelector('.t'), i.title); set(el.querySelector('.b'), i.badge);
    set(el.querySelector('.d'), i.desc); set(el.querySelector('.n'), i.note);
    set(el.querySelector('.c'), costHtml(i.cost));
    el.disabled = !can;
    el.classList.toggle('opacity-50', !can && i.state !== 'done');
    el.classList.toggle('cursor-not-allowed', !can);
    el.classList.toggle('border-amber-400', can);
    el.classList.toggle('border-emerald-600', i.state === 'done');
  }
}

function buy(id) {
  const it = IMAP[id], i = it.info();
  if (i.state !== 'ok' || !afford(i.cost)) return;
  const before = rates();
  pay(i.cost); it.buy();
  showDelta(before, rates());
  it.el.classList.remove('pop'); void it.el.offsetWidth; it.el.classList.add('pop');
  update();
}

// ---------- Sidebar-Visualisierung ----------
const HIST = 60, hist = {}, pAcc = {};
function buildMeters() {
  $('#meters').innerHTML = Object.entries(RES).map(([k, r]) => `
    <div class="rounded-xl bg-slate-800/60 p-3 flex items-center gap-3">
      <div id="orb-${k}" class="relative w-14 h-14 shrink-0">
        <span class="ring absolute inset-0 rounded-full" style="background:${r.color}66"></span>
        <span class="absolute inset-1.5 rounded-full flex items-center justify-center text-2xl shadow-lg" style="background:${r.color}">${r.icon}</span>
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex justify-between items-baseline"><span class="text-sm text-slate-300">${r.name}</span><span id="amt-${k}" class="font-mono font-bold"></span></div>
        <div class="text-xs font-mono flex justify-between"><span><span id="rps-${k}" style="color:${r.color}"></span>/s</span><span id="delta-${k}" class="text-emerald-400 transition-opacity duration-700 opacity-0"></span></div>
        <canvas id="spark-${k}" width="240" height="32" class="w-full h-8 mt-1"></canvas>
      </div>
    </div>`).join('');
  for (const k in RES) { hist[k] = Array(HIST).fill(0); pAcc[k] = 0; }
}

function particle(parent, text, color, x = '50%', y = '30%') {
  const p = document.createElement('span');
  p.className = 'particle';
  p.textContent = text;
  p.style.cssText = `left:${x};top:${y};color:${color};--dx:${(Math.random() - .5) * 50}px`;
  p.onanimationend = () => p.remove();
  parent.append(p);
}

function showDelta(before, after) {
  for (const k in RES) {
    if (after[k] <= before[k] * 1.001) continue;
    const el = $('#delta-' + k);
    el.textContent = before[k] > 0 ? `▲ +${fmt((after[k] / before[k] - 1) * 100)}%` : '▲ NEU';
    el.classList.remove('opacity-0');
    clearTimeout(el._h); el._h = setTimeout(() => el.classList.add('opacity-0'), 2000);
  }
}

function visuals(dt, r) {
  for (const k in RES) {
    const rps = Math.max(r[k], 0), ring = $(`#orb-${k} .ring`);
    // Höhere Rate → schnellerer Puls & mehr Partikel
    const dur = (2.5 / (1 + Math.log10(1 + rps * 10))).toFixed(2);
    if (ring._d !== dur) { ring._d = dur; ring.style.setProperty('--dur', Math.max(dur, .25) + 's'); }
    ring.style.visibility = rps > 0 ? 'visible' : 'hidden';
    if (rps <= 0) continue;
    const perSec = Math.min(12, 1 + Math.log10(1 + rps) * 2);
    pAcc[k] = Math.min(pAcc[k] + dt * perSec, 3);
    for (; pAcc[k] >= 1; pAcc[k]--) particle($('#orb-' + k), '+' + fmt(rps / perSec), RES[k].color);
  }
}

function drawSpark(k) {
  const c = $('#spark-' + k), x = c.getContext('2d'), h = hist[k], max = Math.max(...h, 1e-9), w = c.width / (HIST - 1);
  x.clearRect(0, 0, c.width, c.height);
  x.beginPath();
  h.forEach((v, i) => x.lineTo(i * w, c.height - 2 - (v / max) * (c.height - 4)));
  x.strokeStyle = RES[k].color; x.lineWidth = 2; x.stroke();
  x.lineTo(c.width, c.height); x.lineTo(0, c.height);
  x.fillStyle = RES[k].color + '33'; x.fill();
}

// ---------- Loop ----------
function tick(dt) {
  const r = rates();
  for (const k in RES) S[k] += r[k] * dt;
  return r;
}

function update(r = rates()) {
  for (const k in RES) {
    $('#amt-' + k).textContent = fmt(S[k]);
    $('#rps-' + k).textContent = fmt(r[k]);
  }
  $('#clickVal').textContent = `+${fmt(r.click)} Erz pro Klick`;
  $('#conv').innerHTML = S.research.converter
    ? `♻️ Auto-Konverter: ${fmt(r.conv)} 🪨/s → ${fmt(r.conv / 25)} 🔩/s` : '';
  updateCards();
}

let last = Date.now(), sec = 0;
function loop() {
  const now = Date.now(), dt = (now - last) / 1000;
  last = now;
  const r = tick(dt);
  visuals(dt, r);
  update(r);
  if ((sec += dt) >= 1) {
    sec = 0;
    for (const k in RES) { hist[k].push(Math.max(r[k], 0)); hist[k].shift(); drawSpark(k); }
  }
}

// ---------- Speichern ----------
const KEY = 'eisenwerk-idle-save';
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({ S, t: Date.now() }));
    $('#saved').textContent = 'Gespeichert ' + new Date().toLocaleTimeString('de-DE');
  } catch { $('#saved').textContent = 'Speichern nicht möglich'; }
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (!d) return;
    const def = DEF();
    S = { ...def, ...d.S, gens: { ...def.gens, ...d.S.gens } };
    const off = Math.min((Date.now() - d.t) / 1000, 8 * 3600); // max. 8h Offline-Ertrag
    if (off > 10) {
      const r = rates();
      tick(off);
      toast(`Offline-Ertrag (${Math.round(off / 60)} min): +${fmt(r.ore * off)} 🪨  +${fmt(r.steel * off)} 🔩  +${fmt(r.titan * off)} 💎`);
    }
  } catch { S = DEF(); }
}

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.remove('opacity-0');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.add('opacity-0'), 3500);
}

function showTab(name) {
  document.querySelectorAll('.panel').forEach(p => p.hidden = p.id !== 'tab-' + name);
  document.querySelectorAll('.tab').forEach(b => {
    const on = b.dataset.tab === name;
    b.classList.toggle('bg-orange-600', on);
    b.classList.toggle('bg-slate-800', !on);
  });
}

// ---------- Events ----------
document.addEventListener('click', e => {
  const card = e.target.closest('[data-id]');
  if (card) return buy(card.dataset.id);
  const tab = e.target.closest('[data-tab]');
  if (tab) showTab(tab.dataset.tab);
});
$('#collect').addEventListener('click', e => {
  const r = rates(), btn = e.currentTarget, rect = btn.getBoundingClientRect();
  S.ore += r.click;
  particle(btn, '+' + fmt(r.click), '#fff', (e.clientX - rect.left || rect.width / 2) + 'px', (e.clientY - rect.top || 10) + 'px');
  btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
  update(r);
});
$('#reset').addEventListener('click', () => {
  if (!confirm('Spielstand wirklich löschen?')) return;
  S = DEF(); save(); toast('Neues Spiel gestartet');
});
addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', () => document.hidden && save());

// ---------- Start ----------
buildMeters();
buildCards();
load();
showTab('gens');
update();
setInterval(loop, 100);
setInterval(save, 10000);
</script>
</body>
</html>
