<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute">
<!-- Glasgefaesse, viewBox 0 0 64 80. Glasfarbe ueber CSS-Variable glass (zwei Bindestriche, Fallback hellblau).
     Innenformen: <path id="flask-<form>-inner"> in defs (clipPath-tauglich:
     <clipPath id="c"><use href="#flask-erlenmeyer-inner"/></clipPath> im selben Dokument,
     oder d-Attribut kopieren). Fluessigkeit = <rect> mit clip-path, y von 78 (leer) bis 6 (voll). -->
<defs>
<path id="flask-erlenmeyer-inner" d="M26.5 8H37.5V29L55 66Q56 69 53 69H11Q8 69 9 66L26.5 29Z"/>
<path id="flask-tube-inner" d="M24 10V62A8 8 0 0 0 40 62V10Z"/>
<path id="flask-round-inner" d="M28 8H36V27A23 23 0 1 1 28 27Z"/>
<path id="flask-retort-inner" d="M8.5 52a15.5 15.5 0 1 0 31 0a15.5 15.5 0 1 0 -31 0Z"/>
</defs>
<symbol id="flask-erlenmeyer" viewBox="0 0 64 80">
<path d="M24 6H40V28L58 66Q60 72 54 72H10Q4 72 6 66L24 28Z" fill="var(--glass-fill,#e0f2fe)" fill-opacity=".14" stroke="var(--glass,#bae6fd)" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M21 6H43" stroke="var(--glass,#bae6fd)" stroke-width="3.5" stroke-linecap="round"/>
<path d="M13 64l9-20" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".5" fill="none"/>
</symbol>
<symbol id="flask-tube" viewBox="0 0 64 80">
<path d="M22 8V62A10 10 0 0 0 42 62V8" fill="var(--glass-fill,#e0f2fe)" fill-opacity=".14" stroke="var(--glass,#bae6fd)" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M19 7H45" stroke="var(--glass,#bae6fd)" stroke-width="3.5" stroke-linecap="round"/>
<path d="M27 16V58" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".5" fill="none"/>
</symbol>
<symbol id="flask-round" viewBox="0 0 64 80">
<path d="M26 6H38V26A25 25 0 1 1 26 26Z" fill="var(--glass-fill,#e0f2fe)" fill-opacity=".14" stroke="var(--glass,#bae6fd)" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M23 6H41" stroke="var(--glass,#bae6fd)" stroke-width="3.5" stroke-linecap="round"/>
<path d="M14 52a18 18 0 0 1 6-12" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".5" fill="none"/>
</symbol>
<symbol id="flask-retort" viewBox="0 0 64 80">
<path d="M15 36C16 18 36 8 50 18L58 34L53 36L46 24C38 18 28 22 28 35A18 18 0 1 1 15 36Z" fill="var(--glass-fill,#e0f2fe)" fill-opacity=".14" stroke="var(--glass,#bae6fd)" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M10 56a14 14 0 0 1 4-10" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".5" fill="none"/>
</symbol>
<symbol id="bubble" viewBox="0 0 16 16">
<circle cx="8" cy="8" r="6" fill="#fff" fill-opacity=".18" stroke="#fff" stroke-opacity=".75" stroke-width="1.5"/>
<path d="M5 6a3.5 3.5 0 0 1 3-2" stroke="#fff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity=".9"/>
</symbol>
<symbol id="steam" viewBox="0 0 32 48">
<path d="M10 46C2 38 18 32 10 24S18 10 12 2M22 46C14 38 30 32 22 24S30 10 24 2" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="3" stroke-linecap="round"/>
</symbol>
</svg>
